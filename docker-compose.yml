services:
  wireguard:
    build: ./docker/wireguard
    container_name: wireguard
    cap_add: # 필요 권한 부여
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - SERVERURL=${WG_HOST}
      - SERVERPORT=${WG_PORT}
      - PEERS=${WG_PEERS}
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
    volumes:
      - ./config/wireguard:/config
    ports:
      - "${WG_PORT}:51820/udp"
    sysctls: # 패킷 라우팅 커널 파라미터 수정
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      vpn_network:
        ipv4_address: 172.28.0.200
    restart: unless-stopped

  webdav:
    build: ./docker/webdav
    container_name: webdav
    environment:
      - WEBDAV_USER=${WEBDAV_USER}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD}
    volumes: # S3 Files NFS로 교체
      - webdav_data:/var/webdav
    networks:
      vpn_network:
        ipv4_address: 172.28.0.201
    restart: unless-stopped

networks:
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  webdav_data: