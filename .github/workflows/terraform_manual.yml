name: Terraform 수동 작업

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '작업 선택: plan(계획), apply(적용), destroy(삭제)'
        required: true
        default: 'plan'
      auto_approve:
        description: '(auto-approve) yes 선택 시 apply/destroy가 자동으로 실행됨'
        required: false
        default: 'no'

permissions:
  id-token: write

jobs:
  plan:
    name: Terraform 계획
    runs-on: ubuntu-latest
    env: # Github Secrets에서 환경 변수 설정
      TF_VAR_webdav_user: ${{ secrets.WEBDAV_USER }}
      TF_VAR_webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_repository: ${{ github.repository }}
      TF_VAR_project_name: ${{ github.event.repository.name }}
      TF_VAR_ssh_port: ${{ secrets.SSH_PORT }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform 설치
        uses: hashicorp/setup-terraform@v3

      - name: Terraform 캐시 저장
        uses: actions/cache@v4
        with:
          path: .terraform
          key: ${{ runner.os }}-terraform-${{ github.run_id }}

      - name: Terraform 초기화
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform 계획 생성
        working-directory: terraform
        run: terraform plan -out=tfplan -input=false

      - name: tfplan 관련 파일 저장
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            terraform/tfplan

  apply_or_destroy:
    name: 적용 또는 삭제
    needs: plan
    if: ${{ github.event.inputs.operation == 'apply' || github.event.inputs.operation == 'destroy' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      # 중복처럼 보이지만 각 작업마다 독립적인 실행환경이므로 Terraform 설치와 AWS 자격증명 설정이 필요
      - name: Terraform 설치
        uses: hashicorp/setup-terraform@v3
      
      - name: Terraform 캐시 복원
        uses: actions/cache@v4
        with:
          path: .terraform
          key: ${{ runner.os }}-terraform-${{ github.run_id }}
      
      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: tfplan 관련 파일 다운로드
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform 초기화
        working-directory: terraform
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform 적용
        if: ${{ github.event.inputs.operation == 'apply' }}
        working-directory: terraform
        run: |
          if [ "${{ github.event.inputs.auto_approve }}" = "yes" ]; then
            terraform apply -input=false -auto-approve tfplan/tfplan
          else
            terraform apply -input=false tfplan/tfplan
          fi

      - name: Terraform 삭제
        if: ${{ github.event.inputs.operation == 'destroy' }}
        working-directory: terraform
        run: |
          if [ "${{ github.event.inputs.auto_approve }}" = "yes" ]; then
            terraform destroy -auto-approve -input=false
          else
            echo "리소스 삭제는 명시적 확인이 필요합니다. auto_approve=yes로 다시 실행해주세요."
            exit 1
          fi
